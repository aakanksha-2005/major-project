[project]
name = "rasp"
version = "0.1.0"
description = "RASP - Runtime Agent Safety Platform (experimental prototype, not production-certified)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    # Milestone 2: PostgreSQL is the target persistence layer.
    # asyncpg: works with uvicorn's default event loop on every platform
    # (psycopg's async mode refuses Windows' ProactorEventLoop).
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    # Milestone 4: HTTP client for the local OpenAI-compatible model adapter.
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rasp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
# -m "not postgres" runs the full suite without PostgreSQL (documented
# strategy: M1 mock-model tests never need the database; postgres-marked
# tests use an isolated *_test database and skip explicitly when the
# server is unreachable — never silently substituting SQLite).
markers = [
    "postgres: requires a reachable PostgreSQL test database (skips with an explicit reason when unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (Depends/Query in defaults) is the idiomatic FastAPI DI pattern.
ignore = ["B008"]
