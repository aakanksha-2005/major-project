# Alembic configuration (Milestone 2).
#
# The database URL is NEVER committed here: migrations/env.py reads
# RASP_DATABASE_URL from the environment (see .env.example).

[alembic]
script_location = migrations
prepend_sys_path = src
# Modern path handling (Alembic >= 1.16): avoids the legacy
# space/comma/colon separator guess, which breaks Windows paths.
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
